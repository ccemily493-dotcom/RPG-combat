spec_version: "0.3"
document: engine_invariants
status: provisional
validation_classes:
  hard_invariant:
    effect: fail_resolution_or_build
    authority: mechanical_correctness
  balance_expectation:
    effect: emit_structured_warning
    authority: diagnostic_only
    may_fail_build: false
invariants:
  - id: INV-001
    rule: Core stats are finite numbers in [0, 100] after resolution.
    enforcement: schema_and_runtime_assertion
  - id: INV-002
    rule: The engine never computes or consumes a global Attack Score.
    enforcement: api_contract_and_test
  - id: INV-003
    rule: The engine never resolves a complex plan using one Strategy Score.
    enforcement: require_subaction_dag
  - id: INV-004
    rule: Accuracy and speed/timing resolve before defense and damage.
    enforcement: pipeline_state_machine
  - id: INV-005
    rule: Power denotes delivered force/energy and cannot be written directly to
      health.
    enforcement: damage_conversion_api_only
  - id: INV-006
    rule: Penetration is clamped to [0, 1] and proportionally reduces compatible
      effective filters; it never subtracts flat defense.
    enforcement: formula_contract
  - id: INV-007
    rule: Every defense attempt returns a filter in [0, 100] plus independently
      recorded secondary consequences.
    enforcement: typed_result_and_clamp
  - id: INV-008
    rule: A 100% defense filter may still consume resources or cause stability loss,
      displacement, or a next-turn modifier.
    enforcement: independent_commit_tests
  - id: INV-009
    rule: Known body-zone resistance and vulnerability are used; fallback zone
      selection is deterministic.
    enforcement: contact_resolution_test
  - id: INV-010
    rule: WORLD, CHARACTER, and ACTION modifiers remain distinguishable in input and
      audit records.
    enforcement: layer_enum_and_trace
  - id: INV-011
    rule: "Modifier order is deterministic: operation phase, layer, priority, then
      id."
    enforcement: canonical_sort_test
  - id: INV-012
    rule: Conditional modifier predicates are side-effect-free and read only the
      immutable resolution snapshot.
    enforcement: restricted_predicate_ast
  - id: INV-013
    rule: Micro-variance factor is always in [0.99, 1.01], is seeded reproducibly,
      and is applied no more than once per continuous component.
    enforcement: property_based_test
  - id: INV-014
    rule: Randomness never selects an action, bypasses feasibility, replaces an
      accuracy/speed contest, or grants an unmodeled mechanical effect.
    enforcement: rng_api_visibility_test
  - id: INV-015
    rule: Identical validated inputs, registry versions, ruleset version, and seed
      produce byte-identical canonical results.
    enforcement: replay_golden_test
  - id: INV-016
    rule: Small multi-attacks up to the configured threshold resolve individually;
      batches preserve power, costs, channels, and allocation.
    enforcement: individual_vs_batch_conservation_test
  - id: INV-017
    rule: Mechanical success, damage, filtering, and state deltas are decided only
      by deterministic engine rules plus bounded seeded micro-variance.
    enforcement: authority_boundary_test
  - id: INV-018
    rule: An LLM may classify or decompose text but its output has no mechanical
      authority and must pass deterministic validation.
    enforcement: parser_adapter_contract
  - id: INV-019
    rule: The core RPG engine imports neither universe extensions, the Ability
      Parser, LLM clients, nor external dictionaries.
    enforcement: dependency_graph_test
  - id: INV-020
    rule: Universe-specific state is namespaced and opaque unless converted into
      registered core inputs by the parser/adapter.
    enforcement: namespace_schema_and_registry
  - id: INV-021
    rule: Costs are reserved before consequential resolution and committed according
      to declared cost timing.
    enforcement: transaction_test
  - id: INV-022
    rule: Simultaneous actions read the same immutable snapshot; commit ordering
      cannot change computed outcomes.
    enforcement: permutation_test
  - id: INV-023
    rule: Every provisional numeric coefficient is stored with tunable=true;
      design-mandated constants use tunable=false with a reason.
    enforcement: specification_linter
  - id: INV-024
    rule: NaN, infinities, missing required registry entries, invalid channel
      shares, and incompatible bounds fail validation rather than being coerced.
    enforcement: input_validator
  - id: INV-025
    rule: All resolutions emit sufficient trace data to reproduce base values,
      modifiers, intermediate factors, variance key, and state delta.
    enforcement: audit_schema_test
  - id: INV-026
    rule: Turn resource reservations and commits conserve every resource and never
      permit a negative balance.
    enforcement: turn_resource_property_test
  - id: INV-027
    rule: Reaction remaining and reserved capacity never become negative, and a
      reaction declaration is consumed at most once.
    enforcement: reaction_ledger_property_test
  - id: INV-028
    rule: Mechanically simultaneous action results are independent of
      declaration-array order; explicit ordering uses stable declared values and
      action id only as the final tie-breaker.
    enforcement: turn_permutation_test
  - id: INV-029
    rule: A failed turn commit returns the unchanged starting snapshot and exposes
      no partial canonical mutation.
    enforcement: atomic_turn_transaction_test
  - id: INV-030
    rule: Batch-safe resolution conserves quantity, target allocation, costs, and
      status semantics within configured equivalence tolerances.
    enforcement: batch_equivalence_test
  - id: INV-031
    rule: Every consumed defense source and status definition validates against its
      formal registry schema before resolution.
    enforcement: registry_schema_test
  - id: INV-032
    rule: A complete turn is byte-replayable from its starting snapshot,
      declarations, registries, configuration, and seed.
    enforcement: turn_golden_replay_test
  - id: INV-033
    rule: Simultaneous status and geometry claims use explicit deterministic merge
      policies and never implicit last-write-wins behavior.
    enforcement: merge_conflict_test
  - id: INV-034
    rule: Trace emission is optional and cannot alter complete-turn mechanics.
    enforcement: turn_trace_equivalence_test
  - id: INV-035
    rule: Strategy graphs are acyclic, have unique node ids, and reference only
      declared dependencies.
    enforcement: strategy_schema_and_dag_validation_test
  - id: INV-036
    rule: Strategy-node scheduling and eligibility are deterministic and independent
      of declaration-array ordering.
    enforcement: strategy_scheduler_permutation_test
  - id: INV-037
    rule: A strategy node cannot execute before its declared dependency semantics
      are satisfied.
    enforcement: strategy_dependency_test
  - id: INV-038
    rule: Failed strategy nodes obey their declared failure policy without narrative
      inference.
    enforcement: strategy_failure_policy_test
  - id: INV-039
    rule: A consumed temporal opportunity cannot be consumed twice unless explicitly
      declared reusable.
    enforcement: opportunity_consumption_test
  - id: INV-040
    rule: Duration remaining values never become negative and expiration occurs at
      the configured lifecycle point.
    enforcement: temporal_duration_property_test
  - id: INV-041
    rule: Cooldown availability and progression are deterministic, and unavailable
      actions fail before combat commit.
    enforcement: cooldown_property_test
  - id: INV-042
    rule: Expired modifiers cannot participate in later mechanical resolution.
    enforcement: modifier_expiration_test
  - id: INV-043
    rule: Delayed effects cannot activate before their declared temporal point.
    enforcement: scheduled_effect_timing_test
  - id: INV-044
    rule: Every relational-state endpoint references a valid entity in the immutable
      session snapshot.
    enforcement: relational_reference_validation_test
  - id: INV-045
    rule: Complete multi-turn sessions are byte-replayable from initial state,
      normalized steps, strategies, registries, configuration, and seed.
    enforcement: session_golden_replay_test
  - id: INV-046
    rule: Session trace emission is optional and cannot alter temporal, strategy, or
      combat mechanics.
    enforcement: session_trace_equivalence_test
  - id: INV-047
    rule: Session orchestration never mutates historical input snapshots.
    enforcement: session_snapshot_immutability_test
  - id: INV-048
    rule: Recovery hooks remain within declared resource and capacity bounds.
    enforcement: recovery_bounds_property_test
  - id: INV-049
    rule: Strategy orchestration introduces no hidden mechanical score or bonus.
    enforcement: strategy_authority_boundary_test
  - id: INV-050
    rule: An identical ordinary action resolves mechanically identically when
      declared directly or emitted by a strategy node.
    enforcement: strategy_direct_equivalence_test
  - id: INV-051
    rule: Bounded mechanical history never exceeds the configured maximum depth and
      contains normalized events only.
    enforcement: mechanical_history_bound_test
  - id: INV-052
    rule: Cooldowns, scheduled effects, modifiers, statuses, relations,
      opportunities, and strategy transitions use stable deterministic ordering.
    enforcement: temporal_ordering_test
  - id: INV-053
    rule: The session scheduler delegates combat actions to resolveTurn and does not
      duplicate the combat formulas.
    enforcement: session_delegation_test
  - id: INV-054
    rule: "Zero-time transition count per step is bounded and produces a structured error if exceeded."
    enforcement: zero_time_limit_test
  - id: INV-055
    rule: "Execution classes (ZERO_TIME, ACTION, REACTION, MOVEMENT, PASSIVE) map deterministically to scheduler phases."
    enforcement: execution_class_scheduler_test
  - id: INV-056
    rule: "Action and movement economy determine whether economy-consuming nodes execute in the current step or wait."
    enforcement: economy_boundary_test
  - id: INV-057
    rule: "PASSIVE nodes never execute during scheduler initiative; they only respond to declared triggers."
    enforcement: passive_scheduler_test
  - id: INV-058
    rule: "ON_SUCCESS is strict: it evaluates false when the predecessor's result band is partial."
    enforcement: on_success_strict_test
  - id: INV-059
    rule: "ON_PARTIAL_OR_BETTER evaluates true for both partial and full success bands."
    enforcement: on_partial_or_better_test
  - id: INV-060
    rule: "Strategy completion_policy determines structural completion without inventing a universal strategy success value."
    enforcement: completion_policy_test
  - id: INV-061
    rule: "A strategy may complete structurally while a declared required goal retains its failed mechanical outcome."
    enforcement: required_goals_test
  - id: INV-062
    rule: "ACTIVATE_FALLBACK failure policy activates declared fallback nodes on primary failure."
    enforcement: fallback_goal_test
  - id: INV-063
    rule: "Strategy completion_policy defaults to ALL_TERMINAL when not explicitly declared."
    enforcement: completion_policy_default_test
  - id: INV-064
    rule: "cross_turn_resource_reservation defaults to false; no cross-turn economy is reserved by the scheduler."
    enforcement: cross_turn_reservation_test
  - id: INV-065
    rule: "MOVEMENT nodes consume movement_economy for characters that declare it, otherwise fall back to action_economy."
    enforcement: movement_economy_test
  - id: INV-066
    rule: "normalizeStrategyDag fills execution_class and goals defaults before validation."
    enforcement: normalization_defaults_test
  - id: INV-067
    rule: "Every node reaching the scheduler has an explicit execution_class after normalization."
    enforcement: execution_class_explicit_test
  - id: INV-068
    rule: "Partial primitive results preserve the partial band as a distinct outcome rather than coercing to success or failure."
    enforcement: partial_band_preservation_test
  - id: INV-069
    rule: "Strategy diagnostics are non-blocking and never affect mechanical outcomes."
    enforcement: diagnostics_nonblocking_test
  - id: INV-070
    rule: "ZERO_TIME nodes that complete in one step correctly unlock newly eligible dependent nodes in the same step."
    enforcement: zero_time_chain_test
  - id: INV-071
    rule: "The RPG Engine imports zero Ability Parser modules."
    enforcement: dependency_direction_test
  - id: INV-072
    rule: "The Ability Parser invokes no engine outcome resolver and executes no arbitrary code."
    enforcement: parser_authority_test
  - id: INV-073
    rule: "Ability definitions pass formal schema validation before compilation."
    enforcement: ability_definition_schema_test
  - id: INV-074
    rule: "Compiled abilities pass their formal schema before registration or use."
    enforcement: compiled_ability_schema_test
  - id: INV-075
    rule: "Runtime ability parameters are declared, typed, and bounded before instantiation."
    enforcement: ability_parameter_test
  - id: INV-076
    rule: "Unknown stat, resource, status, defense, and registry references fail compilation."
    enforcement: ability_reference_test
  - id: INV-077
    rule: "Unsafe expression operations, division by zero, NaN, and Infinity cannot enter normalized mechanics."
    enforcement: expression_safety_test
  - id: INV-078
    rule: "Expression depth and node-count limits are enforced."
    enforcement: expression_complexity_test
  - id: INV-079
    rule: "Identical ability definitions and compatibility inputs compile byte-identically."
    enforcement: compilation_determinism_test
  - id: INV-080
    rule: "Cached and uncached ability compilation produce canonical equivalent artifacts."
    enforcement: compilation_cache_test
  - id: INV-081
    rule: "Identical compiled abilities and runtime bindings instantiate byte-identical normalized payloads."
    enforcement: instantiation_determinism_test
  - id: INV-082
    rule: "Presentation-only metadata cannot alter an ability's mechanical hash."
    enforcement: presentation_independence_test
  - id: INV-083
    rule: "Ability compilation and instantiation cannot mutate caller definitions, state, or registries."
    enforcement: parser_immutability_test
  - id: INV-084
    rule: "Ability Parser output contains attempts and declarations, never final damage, hit, defense, or status outcomes."
    enforcement: outcome_boundary_test
  - id: INV-085
    rule: "Ability-generated multi-hit actions obey ordinary quantity, batching, and resource-cost mechanics."
    enforcement: generated_multihit_test
  - id: INV-086
    rule: "Ability-generated status attempts obey ordinary engine resistance and merge mechanics."
    enforcement: generated_status_test
  - id: INV-087
    rule: "Ability-generated Strategy DAG fragments retain v0.3.1 execution-class and economy semantics."
    enforcement: generated_strategy_test
  - id: INV-088
    rule: "Identical normalized actions resolve identically whether authored manually or instantiated by Ability Parser."
    enforcement: mechanical_equivalence_test
  - id: INV-089
    rule: "The RPG Engine imports zero Semantic Input modules."
    enforcement: semantic_dependency_lint
  - id: INV-090
    rule: "The Ability Parser imports zero Semantic Input modules."
    enforcement: semantic_dependency_lint
  - id: INV-091
    rule: "Semantic Input invokes no mechanical outcome resolver and executes no arbitrary code."
    enforcement: semantic_authority_lint
  - id: INV-092
    rule: "Semantic intents cannot contain final damage, hit, defense, status-application, resource, or strategy outcomes."
    enforcement: semantic_outcome_boundary_test
  - id: INV-093
    rule: "A high-confidence rule parse never invokes the optional fallback provider."
    enforcement: semantic_fast_path_test
  - id: INV-094
    rule: "Every fallback candidate passes schema, authority, entity, and registry validation before downstream compilation."
    enforcement: fallback_validation_test
  - id: INV-095
    rule: "Invalid fallback data cannot reach the Ability Parser or RPG Engine."
    enforcement: fallback_rejection_test
  - id: INV-096
    rule: "Semantic dictionary compilation and lookup are deterministic."
    enforcement: dictionary_determinism_test
  - id: INV-097
    rule: "Dictionary namespace precedence is explicit, deterministic, and independent of file load order."
    enforcement: dictionary_precedence_test
  - id: INV-098
    rule: "Synonym declaration ordering cannot change canonical semantic candidates."
    enforcement: synonym_order_test
  - id: INV-099
    rule: "Identical normalized text and context produce the same semantic intent mechanics."
    enforcement: semantic_determinism_test
  - id: INV-100
    rule: "Cached and uncached semantic parsing are mechanically equivalent."
    enforcement: semantic_cache_test
  - id: INV-101
    rule: "Dictionary, ability-registry, and entity-context hash changes invalidate incompatible semantic cache entries."
    enforcement: semantic_cache_invalidation_test
  - id: INV-102
    rule: "Ambiguous entity references are returned for disambiguation and never silently selected."
    enforcement: semantic_ambiguity_test
  - id: INV-103
    rule: "Semantic Input never chooses a tactically best target for the player."
    enforcement: semantic_target_authority_test
  - id: INV-104
    rule: "Learned semantic candidates are never promoted into canonical dictionaries automatically."
    enforcement: candidate_learning_test
  - id: INV-105
    rule: "Descriptive ability names have no mechanics without an explicit registered alias and compiled ability."
    enforcement: semantic_ability_reference_test
  - id: INV-106
    rule: "Rule-generated and fallback-generated identical SemanticIntent data compile to identical normalized mechanics."
    enforcement: semantic_path_equivalence_test
  - id: INV-107
    rule: "Manually authored and semantically generated identical normalized actions resolve identically."
    enforcement: semantic_mechanical_equivalence_test
  - id: INV-108
    rule: "Semantic trace and diagnostic inspection cannot change normalized intent or compiled mechanics."
    enforcement: semantic_observability_test
  - id: INV-109
    rule: "Semantic schemas validate before compilation and preserve source-span data for structured errors and UI highlighting."
    enforcement: semantic_schema_span_test
  - id: INV-110
    rule: "Spanish, English, extension, and ability vocabulary remain data packages; no franchise vocabulary is built into the universal parser."
    enforcement: semantic_locale_boundary_test
  - id: INV-111
    rule: "The RPG Engine imports zero Extension SDK or universe modules."
    enforcement: extension_dependency_audit
  - id: INV-112
    rule: "Extension manifests validate before any content is compiled."
    enforcement: extension_schema_test
  - id: INV-113
    rule: "Extension dependency ordering is deterministic and cycles fail before compilation."
    enforcement: extension_dependency_test
  - id: INV-114
    rule: "Missing or incompatible extension dependencies fail structurally."
    enforcement: extension_dependency_test
  - id: INV-115
    rule: "Registry collisions never resolve through incidental load order."
    enforcement: extension_collision_test
  - id: INV-116
    rule: "All extension-owned identifiers remain in their declared namespace."
    enforcement: extension_namespace_test
  - id: INV-117
    rule: "Compiled extension packages and composed registries are immutable."
    enforcement: extension_immutability_test
  - id: INV-118
    rule: "Equivalent extension package inputs produce identical mechanical hashes."
    enforcement: extension_hash_test
  - id: INV-119
    rule: "Presentation-only extension metadata cannot alter the mechanical hash."
    enforcement: extension_hash_test
  - id: INV-120
    rule: "Stat aliases map to exactly one existing core stat and never replace core categories."
    enforcement: extension_scaling_test
  - id: INV-121
    rule: "Extension resources remain namespaced and resource-type agnostic to the core."
    enforcement: extension_registry_test
  - id: INV-122
    rule: "Extension abilities compile into ordinary Ability Parser contracts."
    enforcement: extension_ability_test
  - id: INV-123
    rule: "Extension semantic vocabulary cannot bypass schema or Ability Parser validation."
    enforcement: extension_semantic_test
  - id: INV-124
    rule: "Domain conflict resolution reports independent properties and no global score."
    enforcement: domain_conflict_test
  - id: INV-125
    rule: "Increasing domain refinement cannot mechanically worsen that property comparison."
    enforcement: domain_monotonicity_test
  - id: INV-126
    rule: "Domain declarations do not create automatic hits."
    enforcement: domain_authority_test
  - id: INV-127
    rule: "Binding-vow restrictions and consequences are explicit mechanical contracts, not inferred scores."
    enforcement: binding_contract_test
  - id: INV-128
    rule: "Summons are ordinary persistent entities and cannot inherit free owner economy."
    enforcement: summon_economy_test
  - id: INV-129
    rule: "Stateful status batches remain individual unless explicit safe aggregation is declared."
    enforcement: advanced_extension_config_test
  - id: INV-130
    rule: "Conditional technique requirements are explicit and deterministic."
    enforcement: conditional_contract_test
  - id: INV-131
    rule: "A single-target conditional relation cannot silently remain active on two targets."
    enforcement: conditional_target_test
  - id: INV-132
    rule: "Cancelling a conditional technique removes its relation, trigger, and pending consequence."
    enforcement: conditional_cancel_test
  - id: INV-133
    rule: "Conditional violations emit normalized consequence attempts rather than final outcomes."
    enforcement: conditional_violation_test
  - id: INV-134
    rule: "Asura is extension content and never appears in core mechanics."
    enforcement: core_source_audit
  - id: INV-135
    rule: "Asura legacy stat labels map explicitly to canonical core stats."
    enforcement: asura_mapping_test
  - id: INV-136
    rule: "Energy reserve, output, control, and efficiency vary independently."
    enforcement: asura_independence_test
  - id: INV-137
    rule: "Asura descriptive metadata cannot alter extension mechanics."
    enforcement: asura_hash_test
  - id: INV-138
    rule: "Extension-generated normalized actions are mechanically equivalent to manual normalized actions."
    enforcement: extension_action_equivalence_test
  - id: INV-139
    rule: "Semantic Spanish extension commands preserve extension and ability provenance."
    enforcement: extension_semantic_provenance_test
  - id: INV-140
    rule: "A strategy fragment cannot grant extension actions free economy."
    enforcement: strategy_extension_economy_test
  - id: INV-141
    rule: "Campaign replay from identical normalized inputs is deterministic."
    enforcement: extension_campaign_test
  - id: INV-142
    rule: "Campaign mechanical history remains bounded and contains no narrative authority."
    enforcement: extension_campaign_test
  - id: INV-143
    rule: "Extension packages cannot execute arbitrary package-provided JavaScript."
    enforcement: declarative_loader_audit
  - id: INV-144
    rule: "Core source contains no universe-specific resource, domain, vow, summon, or character branches."
    enforcement: core_source_audit
  - id: INV-145
    rule: "Extension conflict and condition resolvers produce attempts/state contracts, never final combat authority."
    enforcement: extension_authority_test
required_property_tests:
  stat_closure:
    samples:
      value: 10000
      tunable: true
    assertion: resolved stat always lies in [0, 100]
  modifier_determinism:
    permutations:
      value: 1000
      tunable: true
    assertion: input list permutation does not alter the final value or canonical trace
  penetration_monotonicity:
    samples:
      value: 10000
      tunable: true
    assertion: for nonnegative defense and compatibility, greater penetration never
      increases effective filtering
  filter_bounds:
    samples:
      value: 10000
      tunable: true
    assertion: final defense filter always lies in [0, 100]
  variance_bounds:
    samples:
      value: 100000
      tunable: true
    assertion: all sampled factors lie in [0.99, 1.01]
  batch_conservation:
    samples:
      value: 5000
      tunable: true
    tolerance:
      value: 0.000001
      tunable: true
    assertion: batch partitioning conserves declared totals within tolerance
validation_order:
  - schema
  - finite_numbers_and_ranges
  - registry_references
  - extension_namespace
  - modifier_conflicts
  - resource_feasibility
  - resolution
  - postconditions
  - canonical_audit_serialization
