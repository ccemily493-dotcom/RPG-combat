spec_version: "0.3"
document: universal_ability_parser_v0_4
status: provisional

authority:
  direction:
    - Universe_Extension_to_Ability_Parser
    - Ability_Parser_to_Normalized_Engine_Contracts
    - RPG_Engine_to_Mechanical_Result
  parser_determines_outcomes: false
  parser_mutates_canonical_state: false
  engine_imports_ability_parser: false
  semantic_guessing: false

pipeline:
  definition_time: [schema_validation, reference_validation, expression_validation, template_compilation, strategy_fragment_validation, canonical_hashing]
  use_time: [ability_lookup, parameter_validation, actor_target_binding, expression_evaluation, normalized_payload_validation]

expression_language:
  operations: [ADD, SUBTRACT, MULTIPLY, DIVIDE, MIN, MAX, CLAMP, ABS]
  max_depth: { value: 16, tunable: true }
  max_nodes: { value: 128, tunable: true }
  arbitrary_code_forbidden: true
  non_finite_values_forbidden: true
  division_by_zero: EXPRESSION_ERROR
  reference_roots: [actor.stats, actor.resources, parameters, constants, context]

templates: [ATTACK, DEFENSE, MOVEMENT, STATUS_ATTEMPT, RESOURCE_TRANSFER, RESOURCE_DENIAL, MODIFIER_APPLICATION, REACTION, TEMPORAL_EFFECT, RELATIONAL_EFFECT, AREA_EFFECT, STRATEGY_FRAGMENT]

cache:
  identity: [definition_hash, parser_version, ruleset_version, registry_hashes]
  hidden_mutable_state_is_mechanical_input: false
  cached_and_uncached_outputs_must_match: true

metadata:
  parser_version: "0.4.0"
  presentation_fields_excluded_from_mechanical_hash: [name, description, flavor, author_notes, metadata]
  full_definition_hash_retained: true
  semantic_provider_interface_only: true
  semantic_provider_implementation: false

diagnostics:
  non_blocking: true
  suspicious_thresholds:
    power: { value: 300, tunable: true }
    range: { value: 1000, tunable: true }
    quantity: { value: 500, tunable: true }
