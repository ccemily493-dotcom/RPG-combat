execution_classes:
  - ZERO_TIME
  - ACTION
  - REACTION
  - MOVEMENT
  - PASSIVE
zero_time:
  chaining: same_step
  max_transitions:
    value: 64
    tunable: true
passive:
  execution: trigger_driven
  immediate_scheduler_execution: false
partial_results:
  preserve_as_distinct_outcome: true
  on_success_accepts_partial: false
strategy_completion:
  separate_execution_from_goal_outcome: true
  default_policy: ALL_TERMINAL
execution_class_defaults:
  allowed_during_normalization: true
  allowed_inside_scheduler: false
strategic_effects:
  allowed:
    - ADD_MODIFIER
    - REMOVE_MODIFIER
    - ADD_RELATION
    - REMOVE_RELATION
    - SCHEDULE_EFFECT
    - CREATE_OPPORTUNITY
    - RESOURCE_DELTA
  consumption_semantics:
    - ON_ATTEMPT
    - ON_USE
    - ON_SUCCESS
    - ON_TRIGGER
    - NEVER
  no_narrative_payload_has_mechanical_authority: true
diagnostics:
  non_blocking: true
  metrics:
    - node_success_rate
    - branch_frequency
    - setup_duration
    - payoff_modifier
    - reaction_consumption
    - resource_expenditure
    - setup_failure_rate
    - unused_expired_opportunities
  universal_good_strategy_threshold_forbidden: true
subaction_contract:
  required:
    - id
    - type
    - actor_ref
    - targets
    - prerequisites
    - inputs
    - success_rule_ref
    - on_success
    - on_partial
    - on_failure
  dependency_graph_must_be_acyclic: true
  resolution: Each ready subaction is resolved by its referenced deterministic
    rule against an immutable state snapshot.
  common_inputs:
    - position
    - geometry
    - perception
    - reaction
    - coordination
    - movement
    - strategy
    - resources
    - statuses
    - modifiers
    - previous_turn_events
  outcome_bands:
    failure_margin_below:
      value: 0
      tunable: true
    partial_margin_below:
      value: 15
      tunable: true
    success_margin_at_or_above:
      value: 15
      tunable: true
taxonomy:
  feint:
    intent: Induce a defensive commitment toward a false threat.
    decomposition:
      - present_false_cue
      - target_detects_or_misreads_cue
      - exploit_commitment
    primary_mechanics:
      - coordination_vs_perception
      - strategy_vs_strategy
      - reaction_commitment
    outputs:
      - temporary_defense_penalty
      - exposed_zone
      - reaction_consumed
    counters:
      - delay_commitment
      - superior_perception
      - prepared_counter
  distraction:
    intent: Redirect attention away from the true action or location.
    decomposition:
      - create_salient_event
      - allocate_target_attention
      - execute_hidden_action
    primary_mechanics:
      - salience
      - perception_allocation
      - timing
    outputs:
      - perception_penalty
      - target_priority_change
    counters:
      - multi_sensory_awareness
      - ally_warning
      - ignore_distraction
  ambush:
    intent: Begin an attack before targets establish normal awareness.
    decomposition:
      - remain_undetected
      - acquire_target
      - initiate_from_concealment
    primary_mechanics:
      - concealment_vs_perception
      - line_of_sight
      - reaction_window
    outputs:
      - reduced_defense_timing
      - delayed_reaction
      - positional_advantage
    counters:
      - scouting
      - detection
      - prepared_defense
  flank:
    intent: Attack from outside the target's effective facing or coverage.
    decomposition:
      - reposition
      - preserve_access
      - attack_uncovered_arc
    primary_mechanics:
      - movement
      - geometry
      - facing
      - coverage
    outputs:
      - coverage_reduction
      - defense_method_restriction
    counters:
      - turn_to_face
      - formation
      - area_defense
  bait:
    intent: Offer an apparent opportunity to elicit a predicted action.
    decomposition:
      - present_opportunity
      - predict_response
      - trigger_prepared_followup
    primary_mechanics:
      - strategy_prediction
      - target_preferences
      - interrupt_timing
    outputs:
      - action_commitment
      - prepared_bonus
    counters:
      - decline_bait
      - alternate_action
      - counter_bait
  trap:
    intent: Prepare a conditional effect tied to a location, event, or action.
    decomposition:
      - prepare_mechanism
      - conceal_or_signal_mechanism
      - evaluate_trigger
      - resolve_effect
    primary_mechanics:
      - preparation_cost
      - concealment_vs_detection
      - trigger_predicate
    outputs:
      - conditional_action
      - movement_constraint
      - status_attempt
    counters:
      - detect
      - disarm
      - avoid_trigger
      - remote_trigger
  cover:
    intent: Use geometry to obstruct detection or incoming effects.
    decomposition:
      - reach_cover
      - establish_coverage
      - maintain_or_leave_cover
    primary_mechanics:
      - geometry_overlap
      - material_filter
      - movement
    outputs:
      - accuracy_penalty
      - defense_filter
      - line_of_sight_block
    counters:
      - reposition
      - area_effect
      - penetration
      - destroy_cover
  blind_spot:
    intent: Operate outside a target's current sensory coverage.
    decomposition:
      - identify_sensory_arc
      - enter_or_act_within_gap
      - maintain_unobserved_state
    primary_mechanics:
      - perception
      - facing
      - movement
      - noise_or_signature
    outputs:
      - target_acquisition_penalty
      - reaction_delay
    counters:
      - rotate_scan
      - alternate_sense
      - ally_observer
  reposition:
    intent: Change spatial state to improve a later action or deny one.
    decomposition:
      - select_destination
      - validate_path
      - move
      - update_geometry
    primary_mechanics:
      - movement
      - terrain
      - collision
      - threat_zones
    outputs:
      - position_change
      - range_change
      - facing_change
      - cover_access
    counters:
      - intercept
      - zone_control
      - forced_movement
  interrupt:
    intent: Act during a declared window to delay, alter, or cancel another action.
    decomposition:
      - detect_action
      - meet_interrupt_window
      - apply_interrupt_effect
    primary_mechanics:
      - perception
      - reaction
      - timing
      - stability_impact
    outputs:
      - delay
      - cost_loss
      - cancellation
      - degraded_action
    counters:
      - faster_execution
      - conceal_action
      - interrupt_resistance
  counter:
    intent: Use a prepared or reactive action tailored to an opponent's action.
    decomposition:
      - identify_action
      - validate_counter_compatibility
      - execute_counter
      - resolve_original_remainder
    primary_mechanics:
      - perception
      - reaction
      - compatibility
      - execution
    outputs:
      - incoming_filter
      - redirection
      - counterattack_window
    counters:
      - feint
      - uncounterable_tag
      - multi-vector_attack
  isolation:
    intent: Separate a target from allies, support, or a useful region.
    decomposition:
      - identify_connection
      - block_or_move_across_connection
      - maintain_separation
    primary_mechanics:
      - position
      - forced_movement
      - pathing
      - coverage
    outputs:
      - support_denial
      - target_group_change
      - route_block
    counters:
      - regroup
      - alternate_route
      - break_control
  resource_denial:
    intent: Reduce access to energy, ammunition, actions, space, or replenishment.
    decomposition:
      - identify_resource_dependency
      - access_resource_or_link
      - disrupt
      - sustain_denial
    primary_mechanics:
      - strategy
      - interaction
      - damage_or_status
      - duration
    outputs:
      - resource_delta
      - cost_multiplier
      - cooldown
      - unavailable_action
    counters:
      - reserve_resource
      - alternate_resource
      - restore_access
  escape:
    intent: End or reduce hostile engagement.
    decomposition:
      - identify_exit_or_break_condition
      - create_separation
      - traverse_route
      - verify_disengagement
    primary_mechanics:
      - movement
      - concealment
      - pursuit
      - terrain
    outputs:
      - distance_gain
      - line_of_sight_break
      - engagement_state_change
    counters:
      - pursuit
      - route_block
      - tracking
      - containment
generic_contest:
  actor_term: weighted_stat_term(actor inputs) + actor situational modifiers
  opposition_term: weighted_stat_term(opposition inputs) + opposition situational modifiers
  margin: actor_term - opposition_term
  micro_variance: attack.yaml#/micro_variance; apply only to continuous terms
  note: Taxonomy entries select inputs and rule references. They never provide a
    single aggregated Strategy Score.
composition:
  multiple_taxonomy_ids_allowed: true
  maximum_plan_depth:
    value: 8
    tunable: true
  maximum_subactions:
    value: 32
    tunable: true
  shared_subactions_are_resolved_once: true
  failed_prerequisite: dependent subaction becomes unavailable, not automatically
    failed unless its rule declares dependency_required
llm_boundary:
  allowed:
    - choose_taxonomy_ids
    - propose_subaction_graph
    - map phrases_to_known_entities
    - emit_ambiguities
  forbidden:
    - calculate_values
    - roll_randomness
    - declare_success
    - invent_runtime_state
    - override_validation
    - create_unregistered_mechanics
  output_must_validate_against: action.schema.json
