spec_version: "0.3"
document: strategy_taxonomy
status: provisional
principles:
  global_strategy_score_forbidden: true
  strategy_is_a_plan_of_mechanical_subactions: true
  classification_never_implies_success: true
  llm_may_classify_or_decompose_only: true
  orchestration_provides_hidden_bonus: false
  ordinary_resolvers_remain_authoritative: true
dag_execution:
  acyclic_only: true
  eligible_layers_per_session_step:
    value: 1
    tunable: true
  stable_order:
    - strategy_id_lexicographic
    - node_id_lexicographic
  node_states:
    - PENDING
    - AVAILABLE
    - RESERVED
    - RESOLVING
    - SUCCEEDED
    - FAILED
    - SKIPPED
    - CANCELLED
    - BLOCKED
    - EXPIRED
  terminal_states:
    - SUCCEEDED
    - FAILED
    - SKIPPED
    - CANCELLED
    - BLOCKED
    - EXPIRED
  dependency_modes:
    - ALL_OF
    - ANY_OF
  dependency_conditions:
    - ON_SUCCESS
    - ON_FAILURE
    - ON_COMPLETION
  failure_policies:
    - CONTINUE
    - CANCEL_DEPENDENTS
    - CANCEL_BRANCH
    - CANCEL_STRATEGY
    - ACTIVATE_FALLBACK
  action_completion_rules:
    - RESOLVED
    - CONTACT
    - NO_CONTACT
    - CANCELLED
  strategy_completion_rule: any_succeeded_after_all_nodes_terminal_unless_cancelled
  partial_primitive_counts_as_dependency_success: true
primitive_resolution:
  outcome_bands:
    failed_below:
      value: 0
      tunable: true
    partial_below:
      value: 10
      tunable: true
  opposed_contests:
    FEINT:
      requirements:
        - valid_actor
        - valid_target
        - target_can_perceive_cue
      actor_terms:
        coordination:
          value: 0.4
          tunable: true
        strategy:
          value: 0.35
          tunable: true
        reaction:
          value: 0.25
          tunable: true
      opposition_terms:
        perception:
          value: 0.45
          tunable: true
        strategy:
          value: 0.35
          tunable: true
        reaction:
          value: 0.2
          tunable: true
      possible_outputs:
        - reaction_consumption
        - timing_disadvantage
        - defense_penalty
        - attention_shift
      counterconditions:
        - prepared_counter
        - delayed_commitment
        - superior_perception
    DISTRACTION:
      requirements:
        - valid_actor
        - valid_target
        - declared_attention_channel
      actor_terms:
        strategy:
          value: 0.4
          tunable: true
        coordination:
          value: 0.3
          tunable: true
        perception:
          value: 0.3
          tunable: true
      opposition_terms:
        perception:
          value: 0.55
          tunable: true
        strategy:
          value: 0.25
          tunable: true
        reaction:
          value: 0.2
          tunable: true
      possible_outputs:
        - attention_modifier
        - perception_modifier
        - reaction_latency_modifier
        - target_selection_disadvantage
      counterconditions:
        - multi_sensory_awareness
        - ally_warning
        - ignored_cue
    AMBUSH:
      requirements:
        - valid_actor
        - valid_target
        - declared_concealment_or_geometry
      actor_terms:
        movement:
          value: 0.3
          tunable: true
        coordination:
          value: 0.25
          tunable: true
        strategy:
          value: 0.45
          tunable: true
      opposition_terms:
        perception:
          value: 0.6
          tunable: true
        reaction:
          value: 0.25
          tunable: true
        strategy:
          value: 0.15
          tunable: true
      possible_outputs:
        - reaction_delay
        - positional_condition
        - timing_modifier
      counterconditions:
        - scouting
        - detection
        - prepared_defense
  action_backed:
    REPOSITION:
      requirements:
        - normalized_movement_action
      possible_outputs:
        - position_change
        - distance_change
        - cover_change
        - relational_eligibility
      counterconditions:
        - interception
        - area_denial
        - spatial_bounds
    INTERRUPT_SETUP:
      requirements:
        - normalized_reaction_or_interrupt_action
      possible_outputs:
        - conditional_interrupt_opportunity
      counterconditions:
        - missed_window
        - insufficient_resource
        - incompatible_trigger
  condition_backed:
    FLANK:
      requirements:
        - relative_geometry_condition
        - awareness_condition
      possible_outputs:
        - coverage_modifier
        - compatibility_modifier
        - reaction_timing_modifier
      counterconditions:
        - facing_change
        - formation
        - area_defense
    BLIND_SPOT:
      requirements:
        - observer_actor_relation
        - geometry_or_attention_condition
      possible_outputs:
        - relational_tracking_condition
        - reaction_eligibility_modifier
        - timing_modifier
      counterconditions:
        - observer_reacquires_actor
        - alternate_sense
        - relation_expiration
    ISOLATE:
      requirements:
        - declared_relational_or_area_condition
      possible_outputs:
        - support_restriction
        - route_modifier
        - target_group_change
      counterconditions:
        - regroup
        - alternate_route
        - break_control
  state_setup:
    BAIT:
      requirements:
        - declared_trigger
        - normalized_payload
      possible_outputs:
        - conditional_opportunity
      counterconditions:
        - trigger_not_taken
        - expiration
        - alternate_action
    TRAP:
      requirements:
        - declared_trigger
        - area_or_target
        - normalized_payload
        - duration
      possible_outputs:
        - scheduled_effect
        - world_modifier
        - status_attempt
      counterconditions:
        - detection
        - disarm
        - trigger_not_met
        - expiration
    COVER:
      requirements:
        - declared_geometry_or_world_hook
      possible_outputs:
        - accuracy_modifier
        - defense_modifier
        - compatibility_constraint
      counterconditions:
        - reposition
        - area_effect
        - penetration
        - cover_removed
    COUNTER_SETUP:
      requirements:
        - declared_trigger
        - normalized_reaction
        - coverage
        - duration
        - reservation_semantics
      possible_outputs:
        - conditional_reaction_opportunity
      counterconditions:
        - trigger_not_met
        - resource_unavailable
        - expiration
    RESOURCE_DENIAL:
      requirements:
        - declared_resource
        - normalized_delta_or_cost_modifier
        - duration
      possible_outputs:
        - resource_delta
        - cost_modifier
        - access_restriction
        - cooldown
      counterconditions:
        - alternate_resource
        - restore_access
        - expiration
    AREA_DENIAL:
      requirements:
        - declared_area
        - normalized_world_payload
        - duration
      possible_outputs:
        - movement_modifier
        - entry_constraint
        - hazard_trigger
        - targeting_constraint
      counterconditions:
        - leave_area
        - remove_source
        - expiration
    ESCAPE_SETUP:
      requirements:
        - declared_exit_or_break_condition
        - normalized_movement_or_relation_payload
      possible_outputs:
        - distance_condition
        - line_of_effect_condition
        - disengagement_opportunity
      counterconditions:
        - pursuit
        - route_block
        - tracking
